services:

  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:16
    networks:
      - airflow-network
    volumes:
      - ./airflow/pg-init-scripts:/docker-entrypoint-initdb.d
      - postgres-db-volume:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  # ==================== REDIS ====================
  redis:
    image: redis:7.2-bookworm
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks:
      - airflow-network

  # ==================== AIRFLOW INIT ====================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - airflow-network

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

    command:
      - bash
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          || true

  # ==================== AIRFLOW API SERVER ====================
  airflow-apiserver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    networks:
      - airflow-network

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      spark-master:
        condition: service_started

    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor

      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_HOME: /opt/spark

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/config:/opt/airflow/config
      - ./airflow/plugins:/opt/airflow/plugins

      - ./spark-apps:/opt/spark-apps
      - ./spark-apps/resources:/opt/spark-resources

    ports:
      - "8080:8080"

    command: api-server

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==================== AIRFLOW SCHEDULER ====================
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    networks:
      - airflow-network

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      airflow-apiserver:
        condition: service_healthy

      spark-master:
        condition: service_started

    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor

      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_HOME: /opt/spark

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/config:/opt/airflow/config
      - ./airflow/plugins:/opt/airflow/plugins

      - ./spark-apps:/opt/spark-apps
      - ./spark-apps/resources:/opt/spark-resources

    command: scheduler

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==================== AIRFLOW WORKER ====================
  airflow-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    networks:
      - airflow-network

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      airflow-apiserver:
        condition: service_healthy

      spark-master:
        condition: service_started

    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor

      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_HOME: /opt/spark

      DUMB_INIT_SETSID: "0"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/config:/opt/airflow/config
      - ./airflow/plugins:/opt/airflow/plugins

      - ./spark-apps:/opt/spark-apps
      - ./spark-apps/resources:/opt/spark-resources

    command: celery worker

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\" || celery --app airflow.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  #                       SPARK CLUSTER
  # ============================================================

  # ==================== SPARK MASTER ====================
  spark-master:
    image: apache/spark:3.5.0
    user: root
    hostname: spark-master
    networks:
      - airflow-network

    ports:
      - "8081:8080"
      - "7077:7077"

    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./spark-apps/resources:/opt/spark-resources
      - ./spark-warehouse:/opt/spark-warehouse

    command: >
      bin/spark-class
      org.apache.spark.deploy.master.Master

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

  # ==================== SPARK WORKER 1 ====================
  spark-worker-1:
    image: apache/spark:3.5.0
    user: root
    networks:
      - airflow-network

    ports:
      - "8082:8081"

    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./spark-apps/resources:/opt/spark-resources
      - ./spark-warehouse:/opt/spark-warehouse

    depends_on:
      spark-master:
        condition: service_started

    command: >
      bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    restart: always

  # ==================== SPARK WORKER 2 ====================
  spark-worker-2:
    image: apache/spark:3.5.0
    user: root
    networks:
      - airflow-network

    ports:
      - "8083:8081"

    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./spark-apps/resources:/opt/spark-resources
      - ./spark-warehouse:/opt/spark-warehouse

    depends_on:
      spark-master:
        condition: service_started

    command: >
      bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    restart: always

  # ==================== SPARK WORKER 3 ====================
  spark-worker-3:
    image: apache/spark:3.5.0
    user: root
    networks:
      - airflow-network

    ports:
      - "8084:8081"

    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./spark-apps/resources:/opt/spark-resources
      - ./spark-warehouse:/opt/spark-warehouse

    depends_on:
      spark-master:
        condition: service_started

    command: >
      bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    restart: always

  # ==================== JUPYTER + PYSPARK ====================
  jupyter-spark:
    image: jupyter/pyspark-notebook:latest
    networks:
      - airflow-network

    ports:
      - "8888:8888"
      - "4040-4080:4040-4080"

    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./spark-apps/resources:/home/jovyan/work/data
      - ./spark-apps/resources/jars:/home/jovyan/work/jars

    environment:
      JUPYTER_ENABLE_LAB: "yes"

    depends_on:
      spark-master:
        condition: service_started

    restart: always

# ==================== VOLUMES ====================
volumes:
  postgres-db-volume:

# ==================== NETWORK ====================
networks:
  airflow-network:
    driver: bridge